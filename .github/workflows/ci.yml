name: CI

# Informational only. This reports build and test status on every push and pull
# request. It does not gate commits or pushes.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vea_sim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vea_sim
      - name: Build
        run: cargo build --verbose
      - name: Sim test
        run: |
          set -o pipefail
          cargo install cargo-pretty-test --locked
          python3 tests/testgen.py

          # Authoritative run. Plain libtest output is the source of truth for
          # pass/fail and carries the panic / assertion message (with the
          # generated-test line number) for every failure. --no-fail-fast so one
          # failure does not hide the rest.
          cargo test --no-fail-fast --color=always -- --nocapture 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}

          # Pretty tree of every test name and its result, for the run summary.
          cargo pretty-test --color=never --no-fail-fast > pretty.txt 2>&1 || true

          {
            echo '### Tests'
            echo '```text'
            cat pretty.txt
            echo '```'
            if [ "$status" -ne 0 ]; then
              echo '### Failures'
              echo '```text'
              # Per-failure blocks: "---- <name> stdout ----" plus its panic /
              # assertion text, then the trailing "failures:" name list.
              grep -E -A 30 '^---- ' test-output.txt || cat test-output.txt
              echo
              sed -n '/^failures:$/,/^test result:/ p' test-output.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

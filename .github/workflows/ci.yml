name: CI

# Informational only. This reports build and test status on every push and pull
# request. It does not gate commits or pushes.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vea_sim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vea_sim
      - name: Build
        run: cargo build --verbose
      - name: Sim test
        run: |
          set -o pipefail
          cargo install cargo-pretty-test --locked
          python3 tests/testgen.py

          # Authoritative run. Plain libtest output is the source of truth for
          # pass/fail and carries the panic / assertion message (with the
          # generated-test line number) for every failure. --no-fail-fast so one
          # failure does not hide the rest.
          cargo test --no-fail-fast --color=always -- --nocapture 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}

          # Pretty tree of every test name and its result, for the run summary.
          cargo pretty-test --color=never --no-fail-fast > pretty.txt 2>&1 || true

          {
            echo '### Tests'
            echo '```text'
            cat pretty.txt
            echo '```'
            if [ "$status" -ne 0 ]; then
              echo '### Failures'
              echo '```text'
              # Per-failure blocks: "---- <name> stdout ----" plus its panic /
              # assertion text, then the trailing "failures:" name list.
              grep -E -A 30 '^---- ' test-output.txt || cat test-output.txt
              echo
              sed -n '/^failures:$/,/^test result:/ p' test-output.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

  rtl:
    # Pinned, not ubuntu-latest: setup.sh targets a Debian/Ubuntu apt layout.
    # The testbenches need Verilator 5 (--binary --timing) built newer than
    # Ubuntu 24.04's own apt package. setup.sh builds a known-good toolchain
    # from source instead of relying on the distro package.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vea_sim
      # setup.sh tracks upstream master/main, with no version pin, so a cache
      # keyed on the script's own content is correct: the same script always
      # means the same build, and an edit to the script is the only event
      # that should trigger a fresh one.
      - name: Cache FPGA toolchain
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fpga-toolchain
          key: fpga-toolchain-${{ runner.os }}-${{ hashFiles('setup.sh') }}
      # setup.sh only builds a tool that command -v cannot already find. This
      # step must put a cache hit on PATH before setup.sh runs, or it will not
      # see the cached tools and will rebuild them anyway.
      - name: Add FPGA toolchain to PATH
        run: |
          echo "${{ github.workspace }}/.fpga-toolchain/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/.fpga-toolchain/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Build FPGA toolchain
        env:
          PREFIX: ${{ github.workspace }}/.fpga-toolchain
        run: bash "${{ github.workspace }}/setup.sh"
      - name: RTL testbenches
        run: |
          set -o pipefail

          # The Makefile keeps going after a failure, so one run shows the
          # result of every testbench. The exit status is still nonzero.
          make all 2>&1 | tee tb-output.txt
          status=${PIPESTATUS[0]}

          {
            echo '### RTL testbenches'
            echo '```text'
            grep -E '^(== |tb_[a-z]+: |FAIL|%Fatal)' tb-output.txt || cat tb-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

  pnr:
    # Runs after rtl: place-and-route is slow, and there is no reason to pay
    # for it when the testbenches already caught a failure.
    needs: rtl
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      # Same cache key as the rtl job's toolchain, so this job reads what that
      # job already built instead of building it again.
      - name: Cache FPGA toolchain
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fpga-toolchain
          key: fpga-toolchain-${{ runner.os }}-${{ hashFiles('setup.sh') }}
      - name: Add FPGA toolchain to PATH
        run: |
          echo "${{ github.workspace }}/.fpga-toolchain/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/.fpga-toolchain/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Build FPGA toolchain
        env:
          PREFIX: ${{ github.workspace }}/.fpga-toolchain
        run: bash "${{ github.workspace }}/setup.sh"
      - name: Place and route, check Fmax
        run: |
          set -uo pipefail

          FMAX_FLOOR_MHZ=50

          make pnr
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "make pnr failed (exit $rc)"
            exit "$rc"
          fi

          # nextpnr prints an early, pre-route placement estimate, then the
          # real, routed number once routing finishes. The routed number is
          # the one that matters, and it is the last one in the log. Each such
          # line also names the constraint target in MHz in a trailing
          # parenthesis, so the match must anchor on the line and the colon
          # before it, not just any number next to "MHz".
          fmax=$(grep -E "^Info: Max frequency for clock" build/pnr.log | tail -1 \
            | sed -E "s/^Info: Max frequency for clock '[^']*': ([0-9]+\.[0-9]+) MHz.*/\1/")
          if ! [[ "$fmax" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "No Max frequency line found in build/pnr.log, or its format changed"
            exit 1
          fi

          {
            echo '### Place and route'
            echo '```text'
            grep -E '^Info: Max (frequency|delay)' build/pnr.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if awk -v f="$fmax" -v floor="$FMAX_FLOOR_MHZ" 'BEGIN { exit !(f >= floor) }'; then
            echo "Fmax ${fmax} MHz meets the ${FMAX_FLOOR_MHZ} MHz floor"
          else
            echo "Fmax ${fmax} MHz is below the ${FMAX_FLOOR_MHZ} MHz floor"
            exit 1
          fi
